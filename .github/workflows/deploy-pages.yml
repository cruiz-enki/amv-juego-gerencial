# GH-001 · Publica Punto Crítico en GitHub Pages.
# No toca Vercel: Vercel sigue compilando con base "/" a partir de main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el código y publicar en Pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no cancela una que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Build para Pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages no tiene rewrites: 404.html = index.html permite abrir rutas profundas
      # (p. ej. /amv-juego-gerencial/facilitador). .nojekyll evita el procesado Jekyll.
      - name: Fallback SPA
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
